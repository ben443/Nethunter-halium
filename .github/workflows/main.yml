name: Build Nethunter Halium

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: "Build target: generic-30, generic-32 or gki-5.10"
        required: true
        default: "generic-32"
        type: choice
        options:
          - generic-30
          - generic-32
          - gki-5.10
  pull_request:
    paths:
      - "*.sh"
      - ".github/workflows/main.yml"

permissions:
  contents: read

env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  DEBIAN_FRONTEND: noninteractive

jobs:
  validate-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio tar gzip

      - name: Validate shell script syntax
        run: |
          set -e
          for file in ./*.sh; do
            bash -n "$file"
          done

      - name: Smoke test build argument handling
        run: |
          set -e
          chmod +x build.sh
          if ./build.sh gki-4 > /tmp/build-invalid.log 2>&1; then
            echo "Expected invalid GKI target to fail" >&2
            exit 1
          fi
          grep -q "Unsupported GKI version" /tmp/build-invalid.log

          if ./build.sh generic-32 --arch > /tmp/build-arch.log 2>&1; then
            echo "Expected missing --arch value to fail" >&2
            exit 1
          fi
          grep -q -- "--arch requires a value" /tmp/build-arch.log

      - name: Smoke test build flow with stubs
        run: |
          set -e
          SMOKE_DIR="/tmp/nethunter-smoke"
          rm -rf "$SMOKE_DIR"
          mkdir -p "$SMOKE_DIR"
          cp build.sh "$SMOKE_DIR/build.sh"
          chmod +x "$SMOKE_DIR/build.sh"

          mkdir -p "$SMOKE_DIR/sources/halium/scripts"
          cat > "$SMOKE_DIR/sources/halium/build-gsi.sh" <<'EOF'
          #!/bin/bash
          exit 0
          EOF
          chmod +x "$SMOKE_DIR/sources/halium/build-gsi.sh"

          cat > "$SMOKE_DIR/sources/halium/scripts/halium-install" <<'EOF'
          #!/bin/bash
          out="${@: -1}"
          mkdir -p "$(dirname "$out")"
          touch "$out"
          EOF
          chmod +x "$SMOKE_DIR/sources/halium/scripts/halium-install"

          mkdir -p "$SMOKE_DIR/sources/droidian"
          cat > "$SMOKE_DIR/sources/droidian/mkbootstrap" <<'EOF'
          #!/bin/bash
          output=""
          while [ $# -gt 0 ]; do
            if [ "$1" = "--output" ]; then
              output="$2"
              shift 2
            else
              shift
            fi
          done
          [ -n "$output" ] || exit 1
          tmpdir="$(mktemp -d)"
          mkdir -p "$tmpdir/etc" "$tmpdir/usr/local/bin"
          tar -czf "$output" -C "$tmpdir" .
          rm -rf "$tmpdir"
          EOF
          chmod +x "$SMOKE_DIR/sources/droidian/mkbootstrap"

          mkdir -p "$SMOKE_DIR/sources/nethunter/nethunter-fs/opt/nethunter"
          echo "tool" > "$SMOKE_DIR/sources/nethunter/nethunter-fs/opt/nethunter/tool.txt"
          mkdir -p "$SMOKE_DIR/overlays/devices/generic-32"
          echo "device-overlay" > "$SMOKE_DIR/overlays/devices/generic-32/overlay.txt"

          (
            cd /tmp
            "$SMOKE_DIR/build.sh" generic-32 --skip-lxc
          )

          test -f "$SMOKE_DIR/build/out/nethunter-halium-generic-32.img"
          test -f "$SMOKE_DIR/build/build/rootfs/extracted/overlay.txt"

  build:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make curl wget gdisk parted cpio \
            adb fastboot android-sdk-libsparse-utils \
            docker.io docker-compose python3 python3-pip \
            qemu-user-static debootstrap schroot lxc \
            build-essential devscripts crossbuild-essential-arm64 \
            android-sdk-platform-tools-common repo python3-pycryptodome \
            gzip lz4 locales
          sudo locale-gen en_US.UTF-8

      - name: Prepare sources tree
        run: |
          mkdir -p sources
          git clone --depth=1 https://github.com/Halium/halium-scripts.git sources/halium
          git clone --depth=1 https://github.com/droidian/droidian.git sources/droidian
          git clone --depth=1 https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-project.git sources/nethunter
          test -f build-gsi.sh
          test -f build-gki.sh
          if [ -f sources/halium/halium-install ] && [ ! -f sources/halium/scripts/halium-install ]; then
            mkdir -p sources/halium/scripts
            cp sources/halium/halium-install sources/halium/scripts/halium-install
          fi
          cp build-gsi.sh sources/halium/build-gsi.sh
          cp build-gki.sh sources/halium/build-gki.sh
          chmod +x sources/halium/build-gsi.sh sources/halium/build-gki.sh
          [ -f sources/halium/scripts/halium-install ] && chmod +x sources/halium/scripts/halium-install || true

      - name: Build Nethunter-Halium image
        run: |
          chmod +x build.sh
          ./build.sh "${{ github.event.inputs.build_target }}"

      - name: Validate build output
        run: |
          ls -lh build/out/
          if ! ls build/out/nethunter-halium-*.img 1>/dev/null 2>&1; then
            echo "Build artifact not found!" >&2
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nethunter-halium-${{ github.event.inputs.build_target }}
          path: build/out/nethunter-halium-*.img
